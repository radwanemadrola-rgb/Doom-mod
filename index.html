main{max-width:720px;margin:auto;padding:18px}

.meta{color:#b9adc9;font-size:13px;margin:5px 2px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.game{background:#1b1726;border:1px solid #382d49;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.game .emoji{font-size:28px}.game strong{display:block}.game small{color:#b9adc9}
.add{display:flex;gap:8px;margin-top:20px}.add input{margin:0;min-width:0}.add button{white-space:nowrap}
footer{color:#8e829f;text-align:center;font-size:12px;margin:22px 0}
</style>

let custom=[];
try{custom=JSON.parse(localStorage.getItem("doom_custom_games")||"[]")}catch(e){}
const $=id=>document.getElementById(id);
const normalize=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function distance(a,b){
 const row=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){
  let prev=row[0];row[0]=i;
  for(let j=1;j<=b.length;j++){
   const old=row[j];
   row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));
   prev=old;
  }
 }
 return row[b.length];
}
function render(){
 const q=normalize($("search").value.trim());
 const all=[...defaults,...custom];
 const results=all.filter(name=>{
  if(!q)return true;
  const n=normalize(name);
  return n.includes(q)||q.includes(n)||(q.length>=4&&distance(n,q)<=1);
 });
 $("count").textContent=`${results.length} من ${all.length} لعبة`;
 $("games").innerHTML="";
 if(!results.length){$("games").innerHTML='<p class="meta">لم يتم العثور على اللعبة. يمكنك إضافتها من الأسفل.</p>';return}
 results.forEach(name=>{
  const card=document.createElement("article");card.className="game";
  const emoji=name.toLowerCase().includes("singing")?"🎵":name.toLowerCase().includes("granny")?"👵":"🎮";
  const icon=document.createElement("span");icon.className="emoji";icon.textContent=emoji;
  const info=document.createElement("div");
  const title=document.createElement("strong");title.textContent=name;
  const sub=document.createElement("small");sub.textContent="ضمن مكتبة الألعاب";
  info.append(title,sub);card.append(icon,info);$("games").append(card);
 });
}
$("search").addEventListener("input",render);
function addGame(){
 const name=$("newGame").value.trim();
 if(!name)return;
 const all=[...defaults,...custom];
 if(all.some(g=>normalize(g)===normalize(name))){$("newGame").value="";return}
 custom.push(name);
 localStorage.setItem("doom_custom_games",JSON.stringify(custom));
 $("newGame").value="";render();
}
$("addBtn").addEventListener("click",addGame);
$("newGame").addEventListener("keydown",e=>{if(e.key==="Enter")addGame()});
